<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMapp Reset</title>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui,sans-serif;background:#1a2a40;color:#fff;text-align:center;padding:20px;}
.box{max-width:400px;}
.spinner{border:4px solid rgba(255,255,255,0.2);border-top:4px solid #fff;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto;}
@keyframes spin{100%{transform:rotate(360deg);}}
h1{font-size:1.3rem;margin-bottom:8px;}
p{font-size:0.9rem;opacity:0.7;line-height:1.5;}
</style>
</head>
<body>
<div class="box">
<h1>KMapp Reset</h1>
<p>Brisanje keša i service workera...</p>
<div class="spinner"></div>
<p id="status">Radim...</p>
</div>
<script>
(async function() {
  const status = document.getElementById('status');
  try {
    // Step 1: Clear all caches
    if ('caches' in window) {
      const names = await caches.keys();
      for (const n of names) { await caches.delete(n); }
      status.textContent = 'Keš obrisan (' + names.length + ' keševa)';
    }

    // Step 2: Unregister ALL service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) { await r.unregister(); }
      status.textContent = 'Service workeri uklonjeni (' + regs.length + ')';
    }

    // Step 3: Clear localStorage and sessionStorage
    localStorage.clear();
    sessionStorage.clear();
    status.textContent = 'Sve obrisano. Preusmeravam...';

    // Step 4: Wait a moment then redirect with cache bust
    await new Promise(r => setTimeout(r, 800));
    window.location.replace('/?_=' + Date.now());
  } catch(e) {
    status.textContent = 'Greška: ' + e.message + ' — pokušavam preusmeravanje...';
    setTimeout(function() { window.location.replace('/?_=' + Date.now()); }, 1000);
  }
})();
</script>
</body>
</html>
