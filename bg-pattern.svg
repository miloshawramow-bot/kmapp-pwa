<svg xmlns="http://www.w3.org/2000/svg" width="400" height="800" viewBox="0 0 400 800">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1a1a3e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0d0d1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#f0c850" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#a8893a" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="ornament" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.08">
        <circle cx="40" cy="40" r="30"/>
        <circle cx="40" cy="40" r="20"/>
        <path d="M40 10 L42 30 L40 25 L38 30 Z"/>
        <path d="M40 70 L42 50 L40 55 L38 50 Z"/>
        <path d="M10 40 L30 42 L25 40 L30 38 Z"/>
        <path d="M70 40 L50 42 L55 40 L50 38 Z"/>
        <circle cx="40" cy="40" r="3" fill="#d4af37" opacity="0.15"/>
      </g>
    </pattern>
    <pattern id="diamonds" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="18" y="0" width="4" height="4" fill="#d4af37" opacity="0.05"/>
      <rect x="18" y="20" width="4" height="4" fill="#d4af37" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="400" height="800" fill="url(#glow)"/>
  <rect width="400" height="800" fill="url(#ornament)"/>
  <rect width="400" height="800" fill="url(#diamonds)"/>
  <rect width="400" height="800" fill="url(#gold)"/>
  <!-- Bottom glow -->
  <ellipse cx="200" cy="800" rx="200" ry="150" fill="#d4af37" opacity="0.02"/>
</svg>
