<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KMapp - Oporavak</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0d2240;color:#e0ecf8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center;}
.box{background:white;color:#2a3a4a;border-radius:16px;padding:30px 24px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
h2{color:#0d2240;margin:0 0 8px;font-size:1.2rem;}
p{font-size:0.82rem;color:#6a7d8f;margin:8px 0 18px;}
.status{font-size:0.85rem;padding:10px;border-radius:8px;margin:6px 0;text-align:left;}
.ok{background:#e8f5e9;color:#2a8a3a;font-weight:600;}
.wait{background:#fff3e0;color:#e65100;}
.btn{width:100%;background:linear-gradient(135deg,#0d2240 0%,#1565c0 100%);color:white;border:none;border-radius:10px;padding:13px;font-size:0.95rem;font-weight:800;cursor:pointer;margin-top:12px;}
.btn:active{opacity:0.85;}
</style>
</head>
<body>
<div class="box">
<h2>🔧 KMapp Oporavak</h2>
<p>Ova stranica čisti keš i service worker, pa vas vraća na prijavu sa podrazumevanom lozinkom.</p>
<div id="log"></div>
<button class="btn" id="goBtn" style="display:none;" onclick="location.href='https://miloshawramow-bot.github.io/kmapp-pwa/?nocache=' + Date.now();">Nastavi na prijavu →</button>
</div>
<script>
var log = document.getElementById('log');
function add(msg, cls) {
  var d = document.createElement('div');
  d.className = 'status ' + (cls || 'wait');
  d.textContent = msg;
  log.appendChild(d);
}

add('Brisanje localStorage...');
try {
  localStorage.clear();
  sessionStorage.clear();
  add('✅ localStorage očišćen!', 'ok');
} catch(e) {
  add('⚠️ localStorage: ' + e.message, 'ok');
}

add('Brisanje cache storage...');
if ('caches' in window) {
  caches.keys().then(function(keys) {
    return Promise.all(keys.map(function(k) { return caches.delete(k); }));
  }).then(function() {
    add('✅ Cache storage očišćen!', 'ok');
  }).catch(function(e) {
    add('⚠️ Cache: ' + e.message, 'ok');
  });
} else {
  add('✅ Cache API nije podržan', 'ok');
}

add('Uklanjanje service workera...');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    return Promise.all(regs.map(function(r) { return r.unregister(); }));
  }).then(function() {
    add('✅ Service worker uklonjen!', 'ok');
    add('Sve očišćeno. Kliknite dugme ispod.', 'ok');
    document.getElementById('goBtn').style.display = 'block';
  }).catch(function(e) {
    add('⚠️ SW: ' + e.message, 'ok');
    document.getElementById('goBtn').style.display = 'block';
  });
} else {
  add('✅ Service Worker nije podržan', 'ok');
  document.getElementById('goBtn').style.display = 'block';
}
</script>
</body>
</html>
